spring:
  application:
    name: chat
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.2
  mongodb:
    uri: ${MONGO_CONNECTION_URI}
    database: jolly_chats

auth:
  endpoint: ${AUTHSERVICE_ENDPOINT}

server:
  port: 8085
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    org:
      springframework:
        security: DEBUG
