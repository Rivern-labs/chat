name: Chat Service CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        run: |
          docker build \
            -t rivern/chat:${{ github.sha }} \
            .
      - name: Tag Image
        run: |
          docker tag rivern/chat:${{ github.sha }} \
          784376946770.dkr.ecr.ap-south-1.amazonaws.com/rivern/chat:${{ github.sha }}
      - name: Push Image
        run: |
          docker push \
          784376946770.dkr.ecr.ap-south-1.amazonaws.com/rivern/chat:${{ github.sha }}
